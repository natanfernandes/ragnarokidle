# Local services for development. Start with `pnpm db:up` (Docker Desktop on Windows/macOS).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ragidle
      POSTGRES_PASSWORD: ragidle
      POSTGRES_DB: ragidle
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ragidle -d ragidle']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
